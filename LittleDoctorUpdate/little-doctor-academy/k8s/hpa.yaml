apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: littledoctor
  namespace: infogrid
  labels:
    app: littledoctor
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: littledoctor
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
