{{- if .Values.cognito.secretManager.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "littledoctor.cognitoSecretProviderClassName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "littledoctor.labels" . | nindent 4 }}
    component: {{ .Values.frontend.component }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ required "cognito.secretManager.secretName is required when cognito.secretManager.enabled=true" .Values.cognito.secretManager.secretName | quote }}
        objectType: {{ .Values.cognito.secretManager.objectType | quote }}
        jmesPath:
          - path: COGNITO_USER_POOL_ID
            objectAlias: COGNITO_USER_POOL_ID
          - path: COGNITO_PRIMARY_CLIENT_ID
            objectAlias: COGNITO_PRIMARY_CLIENT_ID
          - path: COGNITO_REGION
            objectAlias: COGNITO_REGION
          - path: COGNITO_USER_POOL_NAME
            objectAlias: COGNITO_USER_POOL_NAME
          - path: COGNITO_USER_POOL_ENDPOINT
            objectAlias: COGNITO_USER_POOL_ENDPOINT
          - path: COGNITO_USER_POOL_ARN
            objectAlias: COGNITO_USER_POOL_ARN
          - path: COGNITO_PRIMARY_CLIENT_NAME
            objectAlias: COGNITO_PRIMARY_CLIENT_NAME
  secretObjects:
    - secretName: {{ include "littledoctor.cognitoSecretName" . }}
      type: Opaque
      data:
        - objectName: COGNITO_USER_POOL_ID
          key: COGNITO_USER_POOL_ID
        - objectName: COGNITO_PRIMARY_CLIENT_ID
          key: COGNITO_PRIMARY_CLIENT_ID
        - objectName: COGNITO_REGION
          key: COGNITO_REGION
        - objectName: COGNITO_USER_POOL_NAME
          key: COGNITO_USER_POOL_NAME
{{- end }}