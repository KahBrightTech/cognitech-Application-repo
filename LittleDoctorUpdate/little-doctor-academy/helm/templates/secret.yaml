{{- if not .Values.cognito.existingSecret }}
# Only created when cognito.existingSecret is empty - see values.yaml
# "cognito" for the out-of-band-Secret alternative (Terraform, External
# Secrets, kubectl, etc.), which is preferred for production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.frontend.name }}-cognito
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "littledoctor.labels" . | nindent 4 }}
    component: {{ .Values.frontend.component }}
type: Opaque
stringData:
  VITE_COGNITO_USER_POOL_ID: {{ .Values.cognito.userPoolId | quote }}
  VITE_COGNITO_CLIENT_ID: {{ .Values.cognito.clientId | quote }}
  VITE_COGNITO_REGION: {{ .Values.cognito.region | quote }}
{{- end }}
