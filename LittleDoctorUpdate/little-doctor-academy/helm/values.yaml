global:
  namespace: infogrid
  appLabel: littledoctor

image:
  registry: 271457809232.dkr.ecr.us-east-1.amazonaws.com
  repository: int-production-use1-ecs
  pullPolicy: Always

cognito:
  existingSecret: ""
  userPoolId: ""
  clientId: ""
  region: "us-east-1"
  secretManager:
    enabled: true
    secretName: int-production-use1-little-doctor-users/cognito2aca1d73b765e339c74f87c45c
    objectType: secretsmanager
    secretProviderClassName: ""

frontend:
  name: littledoctor
  component: frontend
  replicaCount: 2
  image:
    tag: littledoctor-little-doctor-academy-v1.0.9
  containerPort: 8080
  service:
    type: NodePort
    port: 80
    nodePort: 30080
    targetPort: 8080
  probes:
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 20
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  serviceAccount:
    create: false
    name: secret-access
    automount: false
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    managed-by: karpenter
    workload-type: general
  tolerations: []
  affinity: {}
  containerSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]

# HorizontalPodAutoscaler for the frontend Deployment.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  # ALB target-type=ip reaches pods from VPC IPs, not from Kubernetes pods,
  # so the frontend policy must allow those source CIDRs as well.
  # Tighten this to your VPC CIDR(s) once confirmed; 0.0.0.0/0 keeps the
  # internet-facing ALB working immediately.
  ingressCidrs:
  - 0.0.0.0/0

ingress:
  ingressclassname: alb
  ingressname: littledoctor-ingress
  alb_name: littledoctor-alb
  scheme: internet-facing
  controller: ingress.k8s.aws/alb
  # ip = register pod IPs directly as ALB targets (via VPC CNI).
  target_type: ip
  group_name: littledoctor-alb
  healthcheck:
    healthcheck-protocol: "HTTP"
    healthcheck-port: "traffic-port"
    healthcheck-path: "/healthz"
    healthcheck-interval-seconds: "15"
    healthcheck-timeout-seconds: "5"
    success-codes: "200"
    healthy-threshold-count: "2"
    unhealthy-threshold-count: "2"
  # Leave blank to skip HTTPS/the ssl-redirect rule (e.g. local/dev clusters
  # without an ACM cert yet).
  alb_certificate_arn: "arn:aws:acm:us-east-1:271457809232:certificate/31b4636f-d7d5-4109-80f2-6892489df997"
  listenning_ports: '[{"HTTPS":443}, {"HTTP":80}]'
  hostname: "littledoctor.prod.novutechnologies.net"
