global:
  namespace: infogrid
  appLabel: littledoctor

image:
  registry: 271457809232.dkr.ecr.us-east-1.amazonaws.com
  repository: int-production-use1-ecs
  pullPolicy: Always

cognito:
  existingSecret: ""
  userPoolId: ""
  clientId: ""
  region: "us-east-1"
  secretManager:
    enabled: true
    secretName: int-production-use1-little-doctor-users/cognitofff0b469a6496e0ce3b12995de
    objectType: secretsmanager
    secretProviderClassName: ""

frontend:
  name: littledoctor
  component: frontend
  replicaCount: 2
  image:
    tag: littledoctor-little-doctor-academy-v1.0.8
  containerPort: 8080
  service:
    type: NodePort
    port: 80
    nodePort: 30080
    targetPort: 8080
  probes:
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 20
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  serviceAccount:
    create: false
    name: secret-access
    automount: false
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]

# HorizontalPodAutoscaler for the frontend Deployment.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true

ingress:
  ingressclassname: alb
  ingressname: littledoctor-ingress
  alb_name: littledoctor-alb
  scheme: internet-facing
  controller: ingress.k8s.aws/alb
  # ip = register pod IPs directly as ALB targets (via VPC CNI).
  target_type: ip
  group_name: littledoctor-alb
  healthcheck:
    healthcheck-protocol: "HTTP"
    healthcheck-port: "traffic-port"
    healthcheck-path: "/healthz"
    healthcheck-interval-seconds: "15"
    healthcheck-timeout-seconds: "5"
    success-codes: "200"
    healthy-threshold-count: "2"
    unhealthy-threshold-count: "2"
  # Leave blank to skip HTTPS/the ssl-redirect rule (e.g. local/dev clusters
  # without an ACM cert yet).
  alb_certificate_arn: ""
  listenning_ports: '[{"HTTPS":443}, {"HTTP":80}]'
  hostname: "doctor.example.com"
