global:
  namespace: infogrid
  appLabel: littledoctor

image:
  registry: 271457809232.dkr.ecr.us-east-1.amazonaws.com
  repository: int-production-use1-ecs
  pullPolicy: Always

cognito:
  existingSecret: ""
  userPoolId: ""
  clientId: ""
  region: "us-east-1"
  secretManager:
    enabled: true
    secretName: int-production-use1-little-doctor-users/cognitoafb68a4ea5d4772aba63081b46
    objectType: secretsmanager
    secretProviderClassName: ""

frontend:
  name: littledoctor
  component: frontend
  replicaCount: 2
  image:
    tag: littledoctor-little-doctor-academy-v1.0.10
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  probes:
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 20
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  serviceAccount:
    create: false
    name: secret-access
    automount: false
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    managed-by: karpenter
    workload-type: application
  tolerations: []
  affinity: {}
  containerSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]

# HorizontalPodAutoscaler for the frontend Deployment.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  # ingressNamespaces:
  # - ingress-nginx
  ingressCidrs:
  - 0.0.0.0/0

ingress:
  enabled: true
  ingressclassname: "ingress-nginx-prod-litdoc"
  ingressname: littledoctor-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hostname: "littledoctor.prod.novutechnologies.net"
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: "littledoctor-prod-tls"

securityGroupPolicy:
  enabled: false
  name: littledoctor-pod-sgp
  podSelector:
    app: littledoctor
    component: frontend
  securityGroups: [ "sg-0fb243b45a750f6b5" ]
