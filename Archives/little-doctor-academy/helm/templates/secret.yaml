{{- if and (not .Values.cognito.existingSecret) (not .Values.cognito.secretManager.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.frontend.name }}-cognito
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "littledoctor.labels" . | nindent 4 }}
    component: {{ .Values.frontend.component }}
type: Opaque
stringData:
  COGNITO_USER_POOL_ID: {{ .Values.cognito.userPoolId | quote }}
  COGNITO_CLIENT_ID: {{ .Values.cognito.clientId | quote }}
  COGNITO_REGION: {{ .Values.cognito.region | quote }}
{{- end }}
